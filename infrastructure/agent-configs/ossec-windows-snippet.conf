<!--
  =============================================================================
  Proyecto: Laboratorio SOC, Detection Engineering y Triaje Automatizado
  Archivo:  infrastructure/agent-configs/ossec-windows-snippet.conf
  Autor:    Isaac Sánchez Samaniego
  Objetivo: Fragmento de configuración para Wazuh Agent v4.9.2 en Windows 10/11
            (C:\Program Files (x86)\ossec-agent\ossec.conf).
  =============================================================================
  Instrucciones de integración segura:
  1. Sustituir el marcador <WAZUH_MANAGER_HOST_ONLY_IP> (representado en los
     nodos XML como WAZUH_MANAGER_HOST_ONLY_IP para preservar validez XML
     estricta) por la dirección IP privada del adaptador Host-Only VMnet1
     definida en el archivo .env local. Jamás versionar IPs reales del host.
  2. Verificar que los bloques <localfile> queden dentro de <ossec_config>
     y reiniciar el servicio del agente: Restart-Service -Name WazuhSvc
  =============================================================================
-->
<ossec_config>

  <!-- Conexión y enrolamiento cifrado exclusivo por red aislada Host-Only (VMnet1) -->
  <!-- Marcador de reemplazo local: <WAZUH_MANAGER_HOST_ONLY_IP> -->
  <client>
    <server>
      <address>WAZUH_MANAGER_HOST_ONLY_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows, windows10</config-profile>
    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>WAZUH_MANAGER_HOST_ONLY_IP</manager_address>
      <port>1515</port>
      <agent_name>win-soc-endpoint</agent_name>
    </enrollment>
  </client>

  <!-- Ingesta explícita del canal operativo de Microsoft Sysmon (Event IDs 1, 3, 10, 11, 13, 22) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Canal de Seguridad de Windows para correlación con eventos nativos (4625, 4688, 4698) -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID != 5145 and EventID != 5156 and EventID != 5447 and EventID != 4656 and EventID != 4658 and EventID != 4663 and EventID != 4660 and EventID != 4670 and EventID != 4690 and EventID != 4703 and EventID != 4907 and EventID != 5152 and EventID != 5157]</query>
  </localfile>

  <!-- Canal operativo de PowerShell para visibilidad complementaria de bloques de script -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</ossec_config>
