# =============================================================================
# Wazuh SIEM/XDR Single-Node Stack (Hardened & Network-Isolated Lab Edition)
# Basado en wazuh/wazuh-docker v4.9.2 (GPLv2)
# =============================================================================
# Criterios de Seguridad Aplicados:
# 1. Cero credenciales hardcodeadas: inyección estricta desde archivo `.env` local.
# 2. Aislamiento de red en el host:
#    - Consola HTTPS (443), API (55000) e Indexer (9200) atados solo a 127.0.0.1.
#    - Ingesta/registro de agentes (1514/1515) atados solo a la IP Host-Only (VMnet1).
# 3. Detection-as-Code: directorio `detections/wazuh-rules` montado en vivo.
# =============================================================================

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_IMAGE_VERSION:-4.9.2}
    container_name: soc-wazuh-manager
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "${WAZUH_AGENT_BIND_IP:-127.0.0.1}:1514:1514/tcp"
      - "${WAZUH_AGENT_BIND_IP:-127.0.0.1}:1515:1515/tcp"
      - "${WAZUH_LOCAL_BIND_IP:-127.0.0.1}:55000:55000/tcp"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=${INDEXER_USERNAME:?Define INDEXER_USERNAME en .env}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?Define INDEXER_PASSWORD en .env}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=${API_USERNAME:?Define API_USERNAME en .env}
      - API_PASSWORD=${API_PASSWORD:?Define API_PASSWORD en .env}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ../detections/wazuh-rules:/wazuh-config-mount/etc/rules:ro
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - soc_internal_net

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_IMAGE_VERSION:-4.9.2}
    container_name: soc-wazuh-indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    ports:
      - "${WAZUH_LOCAL_BIND_IP:-127.0.0.1}:9200:9200/tcp"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - INDEXER_USERNAME=${INDEXER_USERNAME:?Define INDEXER_USERNAME en .env}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?Define INDEXER_PASSWORD en .env}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem:ro
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem:ro
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem:ro
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -u \"$${INDEXER_USERNAME}:$${INDEXER_PASSWORD}\" https://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - soc_internal_net

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_IMAGE_VERSION:-4.9.2}
    container_name: soc-wazuh-dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
      - "${WAZUH_LOCAL_BIND_IP:-127.0.0.1}:443:5601/tcp"
    environment:
      - INDEXER_USERNAME=${INDEXER_USERNAME:?Define INDEXER_USERNAME en .env}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?Define INDEXER_PASSWORD en .env}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:?Define DASHBOARD_USERNAME en .env}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?Define DASHBOARD_PASSWORD en .env}
      - API_USERNAME=${API_USERNAME:?Define API_USERNAME en .env}
      - API_PASSWORD=${API_PASSWORD:?Define API_PASSWORD en .env}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -skI https://127.0.0.1:5601/app/login | grep -qE 'HTTP/.* (200|302)'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - soc_internal_net

  linux.endpoint:
    build:
      context: ./linux-endpoint
      dockerfile: Dockerfile
    image: soc-lab/linux-endpoint:4.9.2
    container_name: soc-linux-endpoint
    hostname: soc-linux-endpoint
    restart: unless-stopped
    cap_add:
      - AUDIT_CONTROL
      - AUDIT_WRITE
    depends_on:
      wazuh.manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x wazuh-agentd >/dev/null 2>&1 && (pgrep -x sshd >/dev/null 2>&1 || pgrep -f '/usr/sbin/sshd' >/dev/null 2>&1) && pgrep -x rsyslogd >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - soc_internal_net

networks:
  soc_internal_net:
    name: soc_internal_net
    driver: bridge

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
